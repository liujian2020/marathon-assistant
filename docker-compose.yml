version: '3.8'

services:
  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./:/usr/share/nginx/html
    depends_on:
      - api
    restart: unless-stopped

  # Node.js 后端 API
  api:
    build: ./api
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=marathon2026
      - DB_NAME=marathon_assistant
      - JWT_SECRET=your-secret-key-change-in-production-marathon-2026
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # MySQL 数据库
  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=marathon2026
      - MYSQL_DATABASE=marathon_assistant
    volumes:
      - mysql_data:/var/lib/mysql
      - ./api/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
